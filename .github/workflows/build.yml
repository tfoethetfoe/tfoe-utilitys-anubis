
name: Build TFOE's Utilitys

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build addon
        run: ./gradlew --no-daemon clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: TFOEUtil-Anubis-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
